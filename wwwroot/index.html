<!DOCTYPE html>

<head>

    <meta name="description" content="Portfolio of Osanda Naveen — Computer Science &amp; Engineering undergraduate focused on applied machine learning, reinforcement learning and full-stack systems." />
    <base href="/" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="loading-screen">
            <svg class="loading-signal" viewBox="0 0 200 40" width="140">
                <polyline points="0,20 30,20 40,5 50,35 60,20 90,20 100,10 110,30 120,20 200,20" />
            </svg>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        window.resetPageScroll = function () {
            if (window.location.hash) {
                history.replaceState(null, '', window.location.pathname + window.location.search);
            }

            window.scrollTo({ top: 0, left: 0, behavior: 'auto' });
        };

        window.addEventListener('load', window.resetPageScroll);
    </script>
</body>
